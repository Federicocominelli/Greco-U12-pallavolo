<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greco San Martino · Under 12</title>
<style>
:root{
  --blue:#0036fa; --blue-d:#0027b8; --blue-l:#e8edff; --ink:#0f1b3d; --mut:#5b6785;
  --line:#d9e0f5; --bg:#f5f7ff; --card:#ffffff; --ok:#12805c; --warn:#b45309; --bad:#c2271d;
  --s1:#c2271d; --s2:#e07b00; --s3:#c7a600; --s4:#4a9d3a; --s5:#0a8f5d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
header{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{width:46px;height:46px;border-radius:8px;background:#fff;padding:2px}
header h1{font-size:18px;margin:0;line-height:1.15}
header small{opacity:.85;font-size:12.5px}
#sync{margin-left:auto;font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;white-space:nowrap}
#sync.err{background:#ffd9d5;color:#7a130c}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:66px;z-index:19}
nav button{flex:1;border:0;background:none;padding:13px 6px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--blue);border-color:var(--blue)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn:hover{background:var(--blue-d)}
.btn:disabled{background:#aab6e6;cursor:not-allowed}
.btn.sec{background:var(--blue-l);color:var(--blue)}
.btn.sec:hover{background:#d6deff}
.btn.danger{background:#fde6e4;color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px}
.muted{color:var(--mut)}
.err-txt{color:var(--bad);font-size:13px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;cursor:pointer;text-align:left;width:100%}
.pcard:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,54,250,.12)}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.pcard .info{flex:1;min-width:0}
.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vote{font-weight:800;font-size:22px;color:var(--blue);line-height:1}
.vote small{display:block;font-size:11px;color:var(--mut);font-weight:600;text-align:right}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin-top:6px;font-size:11.5px;color:var(--mut)}
.bar{height:7px;background:#e9edfb;border-radius:4px;align-self:center;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.pw{display:flex;flex-direction:column;gap:2px}
.dellink{align-self:flex-end;border:0;background:none;color:var(--bad);font-size:13px;padding:3px 8px;font-weight:600}
.dellink:hover{text-decoration:underline}
.delrow{background:#fde6e4;border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--bad)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,27,61,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:18px;margin:auto}
.modal h2{margin-top:0}
.rate{display:grid;grid-template-columns:1fr;gap:2px;margin:10px 0}
.rate .lbl{font-weight:700}
.stars{display:flex;gap:4px;margin-bottom:8px}
.stars button{flex:1;min-width:0;padding:0;height:40px;font-size:14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:700;color:var(--mut)}
.stars button.on{color:#fff;border-color:transparent}
.hint{font-size:12px;color:var(--mut);margin:-2px 0 8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.delta.up{color:var(--ok);font-weight:700}.delta.down{color:var(--bad);font-weight:700}
/* partita */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-weight:600;display:flex;gap:7px;align-items:center}
.chip b{background:var(--blue-l);color:var(--blue);border-radius:99px;padding:1px 8px;font-size:13px}
.chip.on{border-color:var(--blue);background:var(--blue-l)}
.chip.cap.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.cap.on b{background:#fff}
.steps{counter-reset:s}
.step h3::before{counter-increment:s;content:counter(s);background:var(--blue);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-right:8px}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.court-wrap h4{margin:0 0 4px;font-size:15px}
.court-wrap .sub{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.net{height:8px;background:repeating-linear-gradient(90deg,#0f1b3d 0 6px,#fff 6px 10px);border-radius:3px;margin-bottom:6px;opacity:.75}
.court{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:6px;background:#ffb98a22;border:2px solid #e9b289;border-radius:12px;padding:8px;background:#fbe5d3}
.line3{grid-column:1/-1;height:0;border-top:2px dashed #e0a273;margin:-2px 0;display:none}
.slot{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative;width:100%}
.slot:hover{border-color:var(--blue)}
.slot.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,54,250,.25)}
.slot .pos{position:absolute;top:4px;left:7px;font-size:11px;font-weight:800;color:var(--mut)}
.slot .n{font-size:22px;font-weight:800;color:var(--blue);line-height:1}
.slot .nm{font-size:12.5px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .vt{font-size:11px;color:var(--mut)}
.slot .tag{position:absolute;top:3px;right:5px;font-size:13px}
.slot.cap{background:#fffbe6}
.slot.srv{border-color:var(--s4)}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.badge.c{background:#ffe27a;color:#5a4500}
.warn{background:#fff6e5;border:1px solid #f4d9a3;color:#7a4a05;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.okmsg{background:#e8f7f0;border:1px solid #bfe6d4;color:#0d5c42;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.bench{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.bench button{border:1.5px dashed var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:13.5px;font-weight:600}
.bench button.sel{border-color:var(--blue);background:var(--blue-l)}
.dots{display:inline-flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--blue);border-color:var(--blue)}
tr.low td{background:#fff6e5}
.legend{font-size:12.5px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
textarea.json{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-size:14px}
@media(max-width:520px){main{padding:12px}.slot .nm{font-size:11.5px}.slot{min-height:84px}}
</style>
</head>

<script>
// ===== ENGINE: valutazioni e schieramento =====
const SKILLS = [
  { k: 'battuta', label: 'Battuta' },
  { k: 'ricezione', label: 'Ricezione' },
  { k: 'attacco', label: 'Attacco' },
  { k: 'palleggio', label: 'Palleggio' },
  { k: 'mobilita', label: 'Mobilità' },
];

// media dei 5 fondamentali (scala 1-10)
function media(v) {
  let s = 0;
  for (const sk of SKILLS) s += Number(v[sk.k]) || 0;
  return s / SKILLS.length;
}
// voto complessivo (scala 1-10) = media dei 5 fondamentali
function voto10(v) { return media(v); }

const RING_W = 1.0;      // peso coppie vicine (stesso anello di rotazione)
const OPP_W = 0.35;      // peso coppie opposte (3-6, 2-5, 1-4: una alla volta in colonna centrale)
const BAL_W = 0.125;       // equilibrio tra le 6 rotazioni (forza della prima linea)
const SPLIT_BAL_W = 1.0; // equilibrio di forza tra set 1 e set 2

function teamStats(players) {
  const n = players.length || 1;
  const m = { tot: 0, ric: 0, mob: 0 };
  for (const p of players) {
    m.tot += media(p.voti); m.ric += p.voti.ricezione; m.mob += p.voti.mobilita;
  }
  m.tot /= n; m.ric /= n; m.mob /= n;
  return m;
}

function makeCtx(players) {
  const st = teamStats(players);
  const info = {};
  for (const p of players) {
    const tot = media(p.voti);
    info[p.id] = {
      tot,
      dTot: Math.max(0, st.tot - tot),
      dRic: Math.max(0, st.ric - p.voti.ricezione),
      dMob: Math.max(0, st.mob - p.voti.mobilita),
      bat: p.voti.battuta,
      p,
    };
  }
  return { st, info, cache: new Map() };
}

function pairCost(ctx, a, b) {
  const x = ctx.info[a], y = ctx.info[b];
  return 1.5 * x.dTot * y.dTot + 1.0 * x.dRic * y.dRic + 1.0 * x.dMob * y.dMob;
}

function ringCost(ctx, L) {
  let c = 0;
  for (let i = 0; i < 6; i++) c += RING_W * pairCost(ctx, L[i], L[(i + 1) % 6]);
  for (let i = 0; i < 3; i++) c += OPP_W * pairCost(ctx, L[i], L[i + 3]);
  // equilibrio: somma voti di ogni terna consecutiva (= prima linea nelle 6 rotazioni)
  const sums = [];
  for (let i = 0; i < 6; i++) {
    sums.push(ctx.info[L[i]].tot + ctx.info[L[(i + 1) % 6]].tot + ctx.info[L[(i + 2) % 6]].tot);
  }
  const mean = sums.reduce((a, b) => a + b, 0) / 6;
  const variance = sums.reduce((a, b) => a + (b - mean) * (b - mean), 0) / 6;
  return c + BAL_W * variance;
}

function permutations(arr) {
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    const rest = arr.slice(0, i).concat(arr.slice(i + 1));
    for (const p of permutations(rest)) out.push([arr[i]].concat(p));
  }
  return out;
}
const PERMS5 = permutations([1, 2, 3, 4, 5]);

// migliori disposizioni cicliche (senza riflessioni duplicate) per un gruppo di 6
function bestArrangements(ctx, ids, keep = 3) {
  const key = ids.slice().sort().join('|');
  if (ctx.cache.has(key)) return ctx.cache.get(key);
  const first = ids[0];
  const res = [];
  for (const pm of PERMS5) {
    if (pm[0] > pm[4]) continue; // elimina specchi
    const L = [first].concat(pm.map((i) => ids[i]));
    res.push({ L, cost: ringCost(ctx, L) });
  }
  res.sort((a, b) => a.cost - b.cost);
  const top = res.slice(0, keep);
  ctx.cache.set(key, top);
  return top;
}

function combinations(arr, k) {
  const out = [];
  (function rec(start, cur) {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
  })(0, []);
  return out;
}

// storicoSet: { id: set giocati finora } usato solo come spareggio di equità
function generaFormazioni({ players, captainId, variant = 0, storicoSet = {} }) {
  const N = players.length;
  if (N < 6) throw new Error('Servono almeno 6 giocatrici presenti');
  const ctx = makeCtx(players);
  const tot = (id) => ctx.info[id].tot;

  const sorted = players.map((p) => p.id).sort((a, b) =>
    (tot(b) - tot(a)) || ((storicoSet[a] || 0) - (storicoSet[b] || 0)) || (a < b ? -1 : 1));

  const base = Math.floor(18 / N), r = 18 % N;
  const target = {};
  sorted.forEach((id, i) => { target[id] = base + (i < r ? 1 : 0); });

  // terzo set: le 6 più forti
  const s3 = sorted.slice(0, 6);
  const c = {};
  for (const id of sorted) c[id] = target[id] - (s3.includes(id) ? 1 : 0);

  // capitano obbligatoriamente nel primo set
  if (c[captainId] === 0) {
    const swapIn = sorted.find((id) => !s3.includes(id) && c[id] >= 1);
    if (swapIn) {
      s3.splice(s3.indexOf(captainId), 1, swapIn);
      c[captainId] = 1;
      c[swapIn] -= 1;
    }
  }

  const both = sorted.filter((id) => c[id] === 2);
  const singles = sorted.filter((id) => c[id] === 1);
  const k = 6 - both.length;

  let candidates = [];
  const rest = singles.filter((id) => id !== captainId);
  const capIsSingle = singles.includes(captainId);
  const combos = capIsSingle ? combinations(rest, k - 1).map((x) => x.concat(captainId)) : combinations(rest, k);
  for (const pick of combos) {
    const set1 = both.concat(pick);
    const set2 = both.concat(singles.filter((id) => !pick.includes(id)));
    if (set1.length !== 6 || set2.length !== 6) continue;
    const a1 = bestArrangements(ctx, set1)[0], a2 = bestArrangements(ctx, set2)[0];
    const avg = (s) => s.reduce((t, id) => t + tot(id), 0) / 6;
    const cost = a1.cost + a2.cost + SPLIT_BAL_W * Math.abs(avg(set1) - avg(set2));
    candidates.push({ set1, set2, cost });
  }
  if (!candidates.length) throw new Error('Impossibile comporre i set con questi vincoli');
  candidates.sort((a, b) => a.cost - b.cost);

  const v = Math.abs(variant);
  const cand = candidates[v % Math.min(6, candidates.length)];
  const arrIdx = (ids) => {
    const list = bestArrangements(ctx, ids);
    return list[Math.min(list.length - 1, Math.floor(v / 6) % 3)].L;
  };
  let L1 = arrIdx(cand.set1), L2 = arrIdx(cand.set2), L3 = arrIdx(s3);
  return { sets: [L1, L2, L3], target, captainId };
}

// disposizione in campo: indice anello -> posizione 1..6 per le due versioni
function serverIndex(players, L) {
  const byId = Object.fromEntries(players.map((p) => [p.id, p]));
  let best = 0;
  for (let i = 1; i < 6; i++) {
    const a = byId[L[i]], b = byId[L[best]];
    if (a.voti.battuta > b.voti.battuta ||
        (a.voti.battuta === b.voti.battuta && media(a.voti) > media(b.voti))) best = i;
  }
  return best;
}
// ritorna array di 6 elementi: [{id, ringIdx}] per posizioni P1..P6
function versione(players, L, serverPos) {
  const s = serverIndex(players, L);
  const out = [];
  for (let j = 0; j < 6; j++) {
    const ringIdx = (s + j - (serverPos - 1) + 12) % 6;
    out.push({ id: L[ringIdx], ringIdx });
  }
  return out; // out[0] = P1 ... out[5] = P6
}

// coppie vicine problematiche (sull'anello) per avvisi
function avvisi(players, L) {
  const ctx = makeCtx(players);
  const low = (id, m) => {
    const x = ctx.info[id];
    if (m === 'tot') return x.dTot >= 0.5;
    if (m === 'ric') return x.dRic >= 0.5;
    return x.dMob >= 0.5;
  };
  const out = [];
  for (let i = 0; i < 6; i++) {
    const a = L[i], b = L[(i + 1) % 6];
    const tags = [];
    if (low(a, 'tot') && low(b, 'tot')) tags.push('voto basso');
    if (low(a, 'ric') && low(b, 'ric')) tags.push('ricezione bassa');
    if (low(a, 'mob') && low(b, 'mob')) tags.push('mobilità bassa');
    if (tags.length) out.push({ a, b, tags });
  }
  return out;
}

function normalize(s) {
  const out = { ver: 2, players: [], matches: [] };
  if (!s || typeof s !== 'object') return out;
  const old = s.ver !== 2; // vecchia scala 1-5 -> 1-10
  const conv = (v) => { const r = {}; for (const sk of SKILLS) { const x = Number((v || {})[sk.k]) || (old ? 3 : 5); r[sk.k] = Math.min(10, Math.max(1, old ? x * 2 : x)); } return r; };
  for (const p of (s.players || [])) {
    if (!p || !p.id) continue;
    let storico = Array.isArray(p.storico) && p.storico.length ? p.storico : [{ d: today(), v: p.voti || {}, nota: '' }];
    storico = storico.map((e) => ({ d: e.d, v: conv(e.v), nota: e.nota || '' }));
    const v = {};
    for (const sk of SKILLS) v[sk.k] = Math.min(10, Math.max(1, Number((storico[storico.length - 1].v || {})[sk.k]) || 5));
    out.players.push({ id: String(p.id), nome: String(p.nome || ''), cognome: String(p.cognome || ''), numero: Number(p.numero) || 0, voti: v, storico });
  }
  for (const m of (s.matches || [])) if (m && m.id) out.matches.push(m);
  return out;
}

function localLoad() { try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

function persist() {
  localSave(); dirty = true;
  if (!dbDoc) { setSync('Solo su questo browser', false); return; }
  setSync('Salvataggio…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (saving) { saveTimer = setTimeout(flush, 400); return; }
  saving = true;
  try {
    const snapshot = JSON.parse(JSON.stringify(state));
    dirty = false;
    await dbDoc.set({ ver: 2, players: snapshot.players, matches: snapshot.matches, updatedAt: Date.now() });
    setSync(dirty ? 'Salvataggio…' : 'Salvato ✓');
    if (dirty) saveTimer = setTimeout(flush, 300);
  } catch (e) {
    const ro = e && e.code === 'invalid_argument';
    setSync(ro ? 'Sola lettura (non puoi modificare)' : 'Errore di salvataggio', true);
  }
  saving = false;
}

async function initStorage() {
  const local = localLoad();
  if (local) state = normalize(local);
  render();
  let db = null;
  try { db = await claude.use('db'); } catch (e) { db = null; }
  if (!db) {
    setSync('Solo su questo browser');
    if (!local && SEED_PLAYERS.length) { state = normalize({ ver: 2, players: SEED_PLAYERS, matches: [] }); localSave(); render(); }
    return;
  }
  dbDoc = db.doc('squadra/main');
  const timer = setTimeout(() => { if (!loadedRemote) setSync('Server non raggiungibile: dati locali', true); }, 10000);
  dbDoc.onSnapshot((snap) => {
    if (snap.metadata.hasPendingWrites || dirty || saving) return;
    if (snap.exists) {
      const remote = normalize(snap.data());
      if (JSON.stringify(remote) !== JSON.stringify(state)) { state = remote; localSave(); renderKeepModal(); }
      if (snap.data().ver !== 2 && remote.players.length) persist();
      if (!snap.metadata.fromCache) { loadedRemote = true; clearTimeout(timer); setSync('Salvato ✓'); }
    } else if (!snap.metadata.fromCache) {
      loadedRemote = true; clearTimeout(timer);
      if (state.players.length || state.matches.length) persist(); else setSync('Salvato ✓');
    }
  }, () => { clearTimeout(timer); setSync('Errore di connessione: dati locali', true); });
}

  }));
  $('#e-save').onclick = () => {
    const cognome = $('#e-cognome').value.trim(), nome = $('#e-nome').value.trim(), num = $('#e-num').value.trim(), err = $('#e-err');
    if (!cognome || !nome) { err.textContent = 'Nome e cognome obbligatori.'; return; }
    if (num === '' || isNaN(Number(num)) || Number(num) < 0 || Number(num) > 99) { err.textContent = 'Numero di maglia non valido.'; return; }
    if (state.players.some((q) => q.id !== p.id && q.numero === Number(num))) { err.textContent = 'Numero già assegnato a un\'altra giocatrice.'; return; }
    p.cognome = cognome; p.nome = nome; p.numero = Number(num); persist(); ed.nota = $('#e-nota').value; renderModal(); toast('Dati salvati');
  };
  $('#e-rate').onclick = () => {
    const nota = $('#e-nota').value.trim();
    const entry = { d: today(), v: Object.assign({}, ed.voti), nota };
    const last = p.storico[p.storico.length - 1];
    if (last && last.d === entry.d) p.storico[p.storico.length - 1] = entry; else p.storico.push(entry);
    p.voti = Object.assign({}, ed.voti); ed.isNew = false; ed.nota = ''; persist(); renderModal(); toast('Valutazione salvata');
  };
  const d1 = $('#e-del'); if (d1) d1.onclick = () => { ed.confirmDel = true; ed.nota = $('#e-nota').value; renderModal(); };
  const d0 = $('#e-del0'); if (d0) d0.onclick = () => { ed.confirmDel = false; renderModal(); };
  const d2 = $('#e-del2'); if (d2) d2.onclick = () => {
    state.players = state.players.filter((q) => q.id !== p.id); persist(); ui.present = null; ui.gen = null; ed = null; renderModal(); render();
  };
}

// ===== PARTITA =====
function presentList() { return state.players.filter((p) => (ui.present || new Set(state.players.map((q) => q.id))).has(p.id)); }
function viewPartita() {
  if (!ui.present) ui.present = new Set(state.players.map((p) => p.id));
  if (!ui.date) ui.date = today();
  const pres = presentList();
  const sorted = sortPlayers(state.players).slice().sort((a, b) => a.numero - b.numero);
  if (ui.captain && !ui.present.has(ui.captain)) ui.captain = null;
  let h = '<div class="steps">';
  if (state.players.length < 6) {
    return '<div class="card empty">Servono almeno 6 giocatrici per preparare una partita.<br>Vai su <b>Giocatori</b> e inseriscile.</div>';
  }
  h += '<div class="card step"><h3>Partita</h3><div class="row"><label>Data<input type="date" id="g-date" value="' + ui.date + '"></label></div></div>';
  h += '<div class="card step"><h3>Chi è presente? <span class="muted" style="font-weight:400;font-size:14px">(' + pres.length + ' selezionate)</span></h3><div class="chips" id="pres">' +
    sorted.map((p) => '<button class="chip ' + (ui.present.has(p.id) ? 'on' : '') + '" data-id="' + p.id + '"><b>' + p.numero + '</b>' + esc(short(p)) + '</button>').join('') + '</div>' +
    '<div style="margin-top:8px"><button class="btn sec sm" id="all">Tutte</button> <button class="btn sec sm" id="none">Nessuna</button></div></div>';
  h += '<div class="card step"><h3>Chi è il capitano? <span class="muted" style="font-weight:400;font-size:14px">(giocherà nel primo set)</span></h3><div class="chips" id="caps">' +
    (pres.length ? pres.slice().sort((a, b) => a.numero - b.numero).map((p) => '<button class="chip cap ' + (ui.captain === p.id ? 'on' : '') + '" data-id="' + p.id + '"><b>' + p.numero + '</b>' + esc(short(p)) + '</button>').join('') : '<span class="muted">Seleziona prima le presenti.</span>') + '</div></div>';
  const ok = pres.length >= 6 && ui.captain;
  h += '<div class="row" style="margin-bottom:16px"><button class="btn" id="gen" ' + (ok ? '' : 'disabled') + '>Prepara formazioni</button>' +
    (!ok ? '<span class="muted" style="align-self:center">' + (pres.length < 6 ? 'Servono almeno 6 presenti.' : 'Scegli il capitano.') + '</span>' : '') + '</div></div>';
  if (ui.gen) h += viewGen();
  return h;
}

function curPlayers() { return ui.gen.ids.map(byId).filter(Boolean); }
function slotHtml(players, entry, set, posNum, serverFlag) {
  const p = byId(entry.id);
  const isCap = ui.gen.captainId === p.id;
  const sel = ui.sel && ui.sel.kind === 'ring' && ui.sel.set === set && ui.sel.idx === entry.ringIdx;
  return '<button class="slot ' + (isCap ? 'cap ' : '') + (serverFlag ? 'srv ' : '') + (sel ? 'sel' : '') + '" data-set="' + set + '" data-ring="' + entry.ringIdx + '">' +
    '<span class="pos">P' + posNum + '</span>' + (serverFlag ? '<span class="tag" title="Battuta">🏐</span>' : '') +
    '<span class="n">' + p.numero + '</span><span class="nm">' + esc(short(p)) + '</span><span class="vt">' + f1(voto10(p.voti)) + (isCap ? ' · <span class="badge c">C</span>' : '') + '</span></button>';
}
function courtHtml(players, L, set, serverPos) {
  const V = versione(players, L, serverPos); // V[0]=P1..V[5]=P6
  const order = [4, 3, 2, 5, 6, 1]; // riga alta: P4 P3 P2 ; riga bassa: P5 P6 P1
  return '<div class="net"></div><div class="court">' + order.map((pos) => slotHtml(players, V[pos - 1], set, pos, pos === serverPos)).join('') + '</div>';
}
function viewGen() {
  const g = ui.gen, players = curPlayers();
  const counts = {}; players.forEach((p) => { counts[p.id] = 0; });
  g.sets.forEach((L) => L.forEach((id) => { if (counts[id] !== undefined) counts[id]++; }));
  const vals = Object.values(counts), spread = Math.max(...vals) - Math.min(...vals);
  const L = g.sets[ui.setTab];
  const av = avvisi(players, L);
  const bench = players.filter((p) => !L.includes(p.id)).sort((a, b) => a.numero - b.numero);
  const srvA = serverIndex(players, L), srv = byId(L[srvA]);
  let h = '<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Formazioni</h2>' +
    '<button class="btn sec sm" id="regen">↻ Altra proposta</button> <button class="btn sec sm" id="copy">Copia testo</button></div>';
  h += '<div class="seg" id="settabs" style="margin-bottom:12px">' + [0, 1, 2].map((i) => '<button data-i="' + i + '" class="' + (ui.setTab === i ? 'on' : '') + '">Set ' + (i + 1) + (i === 2 ? ' ★' : '') + '</button>').join('') + '</div>';
  h += '<div class="legend" style="margin-bottom:8px">' + (ui.setTab === 0 ? 'Il capitano <span class="badge c">C</span> è schierato in questo set. ' : '') + (ui.setTab === 2 ? 'Terzo set: giocano le giocatrici con il punteggio più alto. ' : '') + 'Tocca due giocatrici (o una in panchina) per scambiarle. 🏐 = battitrice.</div>';
  if (av.length) h += '<div class="warn">⚠ Vicine con punteggio basso: ' + av.map((x) => esc(short(byId(x.a))) + ' + ' + esc(short(byId(x.b))) + ' (' + x.tags.join(', ') + ')').join(' · ') + '</div>';
  else h += '<div class="okmsg">✓ Nessuna coppia vicina con voto, ricezione o mobilità entrambi bassi.</div>';
  h += '<div class="courts"><div class="court-wrap"><h4>Versione A — palla nostra</h4><div class="sub">La più forte in battuta (' + esc(short(srv)) + ', battuta ' + srv.voti.battuta + '/10) in posizione 1</div>' + courtHtml(players, L, ui.setTab, 1) + '</div>' +
    '<div class="court-wrap"><h4>Versione B — palla agli avversari</h4><div class="sub">Stessa squadra ruotata: ' + esc(short(srv)) + ' in posizione 2, batte dopo il primo cambio palla</div>' + courtHtml(players, L, ui.setTab, 2) + '</div></div>';
  h += '<div class="bench"><span class="muted" style="font-size:13px">In panchina:</span>' + (bench.length ? bench.map((p) => '<button data-b="' + p.id + '" class="' + (ui.sel && ui.sel.kind === 'bench' && ui.sel.id === p.id ? 'sel' : '') + '">' + p.numero + ' ' + esc(short(p)) + '</button>').join('') : '<span class="muted" style="font-size:13px">nessuna</span>') + '</div></div>';
  h += '<div class="card"><h3>Risultato della partita</h3><div class="hint">Inserisci l\'avversario e i punti di ogni set (puoi farlo anche a partita finita e poi premere “Aggiorna partita”).</div>' +
    '<label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600;max-width:420px">Squadra avversaria<input type="text" id="r-opp" value="' + esc(ui.opp) + '" placeholder="es. Volley Rossi" autocomplete="off"></label>' +
    '<div style="margin-top:10px;overflow:auto"><table style="max-width:420px"><thead><tr><th>Set</th><th>Greco San Martino</th><th>Avversari</th></tr></thead><tbody>' +
    [0, 1, 2].map((i) => '<tr><td><b>' + (i + 1) + '</b></td><td><input type="number" min="0" max="99" inputmode="numeric" data-sc="' + i + '-0" value="' + ui.sc[i][0] + '" style="width:80px"></td><td><input type="number" min="0" max="99" inputmode="numeric" data-sc="' + i + '-1" value="' + ui.sc[i][1] + '" style="width:80px"></td></tr>').join('') +
    '</tbody></table></div><div class="err-txt" id="res-err">' + esc(ui.resErr) + '</div>' +
    '<div style="margin-top:10px"><button class="btn" id="savem">' + (g.matchId ? 'Aggiorna partita' : 'Salva partita') + '</button></div></div>';
  h += '<div class="card"><h3>Set giocati in questa partita</h3>' + (spread > 1 ? '<div class="warn">⚠ Differenza di più di 1 set tra le giocatrici (probabilmente per uno scambio manuale).</div>' : '') +
    '<div style="overflow:auto"><table><thead><tr><th>N°</th><th>Giocatrice</th><th>Voto</th><th>Set 1·2·3</th><th>Totale</th><th class="muted">Stagione</th></tr></thead><tbody>' +
    players.slice().sort((a, b) => a.numero - b.numero).map((p) => '<tr class="' + (counts[p.id] === Math.min(...vals) && spread > 0 ? '' : '') + '"><td>' + p.numero + '</td><td>' + esc(pname(p)) + (g.captainId === p.id ? ' <span class="badge c">C</span>' : '') + '</td><td>' + f1(voto10(p.voti)) + '</td><td><span class="dots">' +
      g.sets.map((S) => '<span class="dot ' + (S.includes(p.id) ? 'on' : '') + '"></span>').join('') + '</span></td><td><b>' + counts[p.id] + '</b></td><td class="muted">' + setsPlayed(p.id) + '</td></tr>').join('') + '</tbody></table></div></div>';
  return h;
}

function bindPartita() {
  const d = $('#g-date'); if (d) d.onchange = () => { ui.date = d.value; };
  const o = $('#r-opp'); if (o) o.oninput = () => { ui.opp = o.value; };
  document.querySelectorAll('[data-sc]').forEach((i) => { i.oninput = () => { const [s, k] = i.dataset.sc.split('-').map(Number); ui.sc[s][k] = i.value; }; });
  document.querySelectorAll('#pres .chip').forEach((b) => { b.onclick = () => { const id = b.dataset.id; if (ui.present.has(id)) ui.present.delete(id); else ui.present.add(id); ui.gen = null; render(); }; });
  const all = $('#all'); if (all) all.onclick = () => { ui.present = new Set(state.players.map((p) => p.id)); ui.gen = null; render(); };
  const none = $('#none'); if (none) none.onclick = () => { ui.present = new Set(); ui.gen = null; render(); };
  document.querySelectorAll('#caps .chip').forEach((b) => { b.onclick = () => { ui.captain = b.dataset.id; ui.gen = null; render(); }; });
  const gen = $('#gen'); if (gen) gen.onclick = () => { ui.variant = 0; ui.sel = null; ui.setTab = 0; ui.gen = null; runGen(); render(); setTimeout(() => { const t = $('#settabs'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); };
  const rg = $('#regen'); if (rg) rg.onclick = () => { ui.variant++; ui.sel = null; runGen(); render(); toast('Nuova proposta'); };
  document.querySelectorAll('#settabs button').forEach((b) => { b.onclick = () => { ui.setTab = Number(b.dataset.i); ui.sel = null; render(); }; });
  document.querySelectorAll('.slot').forEach((b) => { b.onclick = () => clickSlot({ kind: 'ring', set: Number(b.dataset.set), idx: Number(b.dataset.ring) }); });
  document.querySelectorAll('.bench button').forEach((b) => { b.onclick = () => clickSlot({ kind: 'bench', id: b.dataset.b }); });
  const cp = $('#copy'); if (cp) cp.onclick = copyText;
  const sv = $('#savem'); if (sv) sv.onclick = saveMatch;
}
function runGen() {
  const pres = presentList();
  const storicoSet = {}; state.players.forEach((p) => { storicoSet[p.id] = setsPlayed(p.id); });
  const r = generaFormazioni({ players: pres, captainId: ui.captain, variant: ui.variant, storicoSet });
  ui.gen = { ids: pres.map((p) => p.id), sets: r.sets, captainId: ui.captain, matchId: ui.gen ? ui.gen.matchId : null };
}
function clickSlot(c) {
  const g = ui.gen, S = ui.setTab;
  if (!ui.sel) { ui.sel = c; render(); return; }
  const a = ui.sel; ui.sel = null;
  if (a.kind === 'ring' && a.set !== S) { ui.sel = c; render(); return; }
  if (a.kind === 'bench' && c.kind === 'bench') { render(); return; }
  const L = g.sets[S];
  if (a.kind === 'ring' && c.kind === 'ring') {
    if (a.idx !== c.idx) { const t = L[a.idx]; L[a.idx] = L[c.idx]; L[c.idx] = t; }
  } else {
    const ring = a.kind === 'ring' ? a : c, bn = a.kind === 'bench' ? a : c;
    L[ring.idx] = bn.id;
  }
  render();
}
function textOut() {
  const g = ui.gen, players = curPlayers();
  const tag = (p) => '#' + p.numero + ' ' + short(p) + (g.captainId === p.id ? ' (C)' : '');
  let t = 'Greco San Martino U12 — ' + fmtDate(ui.date) + (ui.opp.trim() ? ' vs ' + ui.opp.trim() : '') + '\n';
  g.sets.forEach((L, i) => {
    t += '\nSET ' + (i + 1) + '\n';
    [[1, 'A (palla nostra)'], [2, 'B (palla avversari)']].forEach(([sp, lab]) => {
      const V = versione(players, L, sp);
      t += ' ' + lab + ': ' + V.map((e, j) => 'P' + (j + 1) + ' ' + tag(byId(e.id))).join(' | ') + '\n';
    });
    const bench = players.filter((p) => !L.includes(p.id));
    if (bench.length) t += ' Panchina: ' + bench.map((p) => '#' + p.numero + ' ' + short(p)).join(', ') + '\n';
  });
  return t;
}
async function copyText() {
  try { await navigator.clipboard.writeText(textOut()); toast('Formazioni copiate'); }
  catch (e) { showText(textOut()); }
}
function showText(t) {
  const m = $('#modal');
  m.innerHTML = '<div class="ov"><div class="modal"><h2>Formazioni (testo)</h2><div class="hint">Seleziona e copia il testo qui sotto.</div><textarea class="json" id="tx" style="min-height:260px" readonly>' + esc(t) + '</textarea><div style="margin-top:10px"><button class="btn" id="tx-close">Chiudi</button></div></div></div>';
  $('#tx').select(); $('#tx-close').onclick = () => { m.innerHTML = ''; };
}
function matchScores() {
  const out = []; let bad = false;
  for (let i = 0; i < 3; i++) {
    const a = String(ui.sc[i][0]).trim(), b = String(ui.sc[i][1]).trim();
    if (a === '' && b === '') { out.push(null); continue; }
    const na = Number(a), nb = Number(b);
    if (a === '' || b === '' || isNaN(na) || isNaN(nb) || na < 0 || nb < 0) { bad = i + 1; break; }
    out.push({ n: na, l: nb });
  }
  return { out, bad };
}
function saveMatch() {
  const g = ui.gen; if (!g) return;
  const opp = ui.opp.trim();
  if (!opp) { ui.resErr = 'Inserisci il nome della squadra avversaria.'; render(); const e = $('#r-opp'); if (e) { e.focus(); e.scrollIntoView({ block: 'center' }); } return; }
  const ms = matchScores();
  if (ms.bad) { ui.resErr = 'Set ' + ms.bad + ': inserisci i punti di entrambe le squadre (oppure lascia vuoto il set).'; render(); return; }
  ui.resErr = '';
  const data = { d: ui.date || today(), opp, captainId: g.captainId, sets: g.sets.map((L) => L.slice()), punti: ms.out, names: Object.fromEntries(curPlayers().map((p) => [p.id, '#' + p.numero + ' ' + pname(p)])) };
  const ex = g.matchId && state.matches.find((m) => m.id === g.matchId);
  if (ex) { Object.assign(ex, data); toast('Partita aggiornata'); }
  else { g.matchId = uid(); state.matches.push(Object.assign({ id: g.matchId }, data)); toast('Partita salvata in archivio'); }
  persist(); render();
}

// ===== ARCHIVIO =====
function viewArchivio() {
  const ms = state.matches.slice().sort((a, b) => b.d.localeCompare(a.d));
  let h = '<h2>Archivio partite</h2>';
  if (!ms.length) h += '<div class="card empty">Nessuna partita salvata.<br>Dopo aver preparato le formazioni, premi <b>Salva partita</b>: i set giocati servono a far ruotare equamente le giocatrici nelle partite successive.</div>';
  h += ms.map((m) => {
    const ids = [...new Set(m.sets.flat())];
    const nm = (id) => { const p = byId(id); return p ? '#' + p.numero + ' ' + short(p) : (m.names && m.names[id]) || id; };
    return '<div class="card"><div class="row" style="align-items:center"><div style="flex:1"><b>' + fmtDate(m.d) + '</b> · Greco San Martino' + resultStr(m) + ' ' + esc(m.opp || 'avversario n.d.') + '<div class="muted" style="font-size:13px">' + scoreStr(m) + 'capitano: ' + esc(nm(m.captainId)) + '</div></div>' +
      '<button class="btn danger sm" data-del="' + m.id + '">Elimina</button></div>' +
      '<div style="font-size:13.5px;margin-top:8px">' + m.sets.map((S, i) => '<div style="margin-bottom:3px"><b>Set ' + (i + 1) + ':</b> ' + S.map((id) => esc(nm(id))).join(', ') + '</div>').join('') + '</div></div>';
  }).join('');
  h += '<div class="card"><h3>Backup dei dati</h3><div class="hint">' + (dbDoc ? 'I dati sono salvati automaticamente. ' : '<b>I dati sono salvati solo in questo browser</b> (se cancelli i dati di navigazione o cambi dispositivo li perdi). ') + 'Per sicurezza copia ogni tanto un backup: puoi ripristinarlo su un altro dispositivo.</div>' +
    '<div class="row"><button class="btn sec sm" id="bk-copy">Copia backup</button><button class="btn sec sm" id="bk-show">Mostra backup</button></div>' +
    '<div style="margin-top:10px"><textarea class="json" id="bk-text" placeholder="Incolla qui un backup per ripristinarlo…"></textarea><div class="row" style="margin-top:6px"><button class="btn sec sm" id="bk-import">Ripristina da backup</button></div><div class="err-txt" id="bk-err"></div></div></div>';
  return h;
}
let delMatch = null;
function resultStr(m) {
  const ps = (m.punti || []).filter(Boolean);
  if (!ps.length) return ' vs';
  const w = ps.filter((x) => x.n > x.l).length, l = ps.filter((x) => x.n < x.l).length;
  return ' <b style="color:var(--blue)">' + w + ' – ' + l + '</b>';
}
function scoreStr(m) {
  const ps = (m.punti || []);
  if (!ps.some(Boolean)) return '';
  return 'Set: ' + ps.map((x, i) => x ? (i + 1) + '° ' + x.n + '-' + x.l : null).filter(Boolean).join(' · ') + ' · ';
}
function bindArchivio() {
  document.querySelectorAll('[data-del]').forEach((b) => {
    const id = b.dataset.del;
    if (delMatch === id) { b.textContent = 'Conferma eliminazione'; b.onclick = () => { state.matches = state.matches.filter((m) => m.id !== id); delMatch = null; persist(); render(); }; }
    else b.onclick = () => { delMatch = id; render(); };
  });
  $('#bk-copy').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify(state)); toast('Backup copiato'); } catch (e) { $('#bk-text').value = JSON.stringify(state); $('#bk-text').select(); } };
  $('#bk-show').onclick = () => { $('#bk-text').value = JSON.stringify(state); $('#bk-text').select(); };
  $('#bk-import').onclick = () => {
    try { const s = normalize(JSON.parse($('#bk-text').value)); if (!s.players.length && !s.matches.length) throw 0; state = s; ui.present = null; ui.gen = null; persist(); render(); toast('Backup ripristinato'); }
    catch (e) { $('#bk-err').textContent = 'Backup non valido.'; }
  };
}

// ===== RENDER =====
function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.t === ui.tab));
  const main = $('#main');
  if (ui.tab === 'rosa') { main.innerHTML = viewRosa(); bindRosa(); }
  else if (ui.tab === 'partita') { main.innerHTML = viewPartita(); bindPartita(); }
  else { main.innerHTML = viewArchivio(); bindArchivio(); }
}
function renderKeepModal() { if (ed && !byId(ed.id)) { ed = null; renderModal(); } render(); }
document.querySelectorAll('#nav button').forEach((b) => { b.onclick = () => { ui.tab = b.dataset.t; delMatch = null; ui.delId = null; render(); window.scrollTo(0, 0); }; });
initStorage();
</script>
</body>
